# NeoCP Professional Auto-Generated Config for blog.digitalneo.net
server {
    listen 443 ssl http2;
    server_name blog.digitalneo.net www.blog.digitalneo.net;

    root "sandbox/patel/public_html/blog.digitalneo.net";
    index index.php index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Brotli is disabled

    
    ssl_certificate ./cert.pem;
    ssl_certificate_key ./key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Active OWASP WAF Protection
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    if ($query_string ~* "union\s+select|cast\(|drop\s+table|select\s+.*\s+from|insert\s+into") { return 403; }
    if ($request_uri ~* "union\s+select|cast\(|drop\s+table|select\s+.*\s+from|insert\s+into") { return 403; }
    if ($query_string ~* "\.\./|/etc/passwd|/win\.ini|boot\.ini|\.\.%2f|\.\.%2F") { return 403; }
    if ($request_uri ~* "\.\./|/etc/passwd|/win\.ini|boot\.ini|\.\.%2f|\.\.%2F") { return 403; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # FastCGI proxy to local PHP-FPM socket mapped to PHP version 8.2
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9082; # PHP version mapped TCP port
        fastcgi_index index.php;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log "nginx_vhosts/blog.digitalneo.net.access.log";
    error_log "nginx_vhosts/blog.digitalneo.net.error.log" warn;
}
