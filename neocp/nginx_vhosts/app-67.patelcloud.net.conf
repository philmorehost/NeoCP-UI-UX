# NeoCP Professional Auto-Generated Config for app-67.patelcloud.net
server {
    listen 80;
    server_name app-67.patelcloud.net www.app-67.patelcloud.net;

    root "C:/Users/User/.gemini/antigravity/scratch/neocp/sandbox/reseller1/public_html/app-67.patelcloud.net";
    index index.php index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Brotli is disabled

    

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # FastCGI proxy to local PHP-FPM socket mapped to PHP version 8.2
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9082; # PHP version mapped TCP port
        fastcgi_index index.php;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log "C:/Users/User/.gemini/antigravity/scratch/neocp/nginx_vhosts/app-67.patelcloud.net.access.log";
    error_log "C:/Users/User/.gemini/antigravity/scratch/neocp/nginx_vhosts/app-67.patelcloud.net.error.log" warn;
}
